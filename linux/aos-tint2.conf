# AOS conventional Debian/Openbox fallback panel
rounded = 0
border_width = 0
background_color = #101719 100
border_color = #a23b35 100

# Background 1: solid tactical dark
rounded = 0
border_width = 0
background_color = #101719 100
border_color = #a23b35 100

panel_items = LTSC
panel_monitor = all
panel_position = bottom center horizontal
panel_size = 100% 42
panel_margin = 0 0
panel_padding = 7 3 7
panel_background_id = 1
panel_layer = top
panel_dock = 0
panel_shrink = 0
panel_window_name = tint2
panel_urgent = 1
panel_pivot_struts = 0

launcher_padding = 4 2 4
launcher_icon_size = 25
launcher_tooltip = 1
launcher_item_app = /usr/share/applications/xfce4-appfinder.desktop
launcher_item_app = /usr/share/applications/xfce4-terminal.desktop
launcher_item_app = /usr/share/applications/thunar.desktop
launcher_item_app = /usr/local/share/applications/aos-desktop.desktop

taskbar_mode = multi_desktop
taskbar_padding = 3 2 3
taskbar_background_id = 1
taskbar_active_background_id = 1
taskbar_name = 0
taskbar_hide_inactive_tasks = 0
taskbar_hide_different_monitor = 0
taskbar_hide_different_desktop = 0

task_padding = 5 2 5
task_background_id = 1
task_active_background_id = 1
task_icon = 1
task_text = 1
task_centered = 0
task_maximum_size = 180 35
task_font = Noto Sans 9
task_font_color = #e8eeee 100
task_active_font_color = #ffffff 100
task_iconified_font_color = #a5b4b6 100

systray_padding = 5 2 5
systray_icon_size = 22
systray_background_id = 1

time1_format = %H:%M
time1_font = Noto Sans Bold 12
clock_font_color = #e8eeee 100
clock_padding = 9 0
clock_background_id = 1
clock_tooltip = %A %d %B %Y
clock_lclick_command = xfce4-appfinder --collapsed

mouse_left = toggle_iconify
mouse_middle = none
mouse_right = close
wheel_up = prev_task
wheel_down = next_task
