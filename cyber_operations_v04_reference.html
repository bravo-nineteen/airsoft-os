.readout{border-radius:3px;background:#081713;color:#b2e1cc;border-color:#315146}
.records{padding:10px;display:grid;gap:5px;background:#071511}
.traffic-record{display:grid;grid-template-columns:26px 1.2fr 1fr .8fr 16px;align-items:center;gap:9px;border:1px solid #2a493b;background:#11231d;padding:9px 7px;cursor:grab;font:12px ui-monospace,monospace;user-select:none;min-width:0}
.traffic-record:hover,.traffic-record.picked{background:#214a36;border-color:#78bb8f}
.traffic-record span{min-width:0;overflow-wrap:anywhere}.traffic-record small{display:block;color:#92aa9c;font-size:10px;margin-top:2px}.traffic-record .rec-id{color:#80c39c}.rec-dest{color:#c8dfcf}.rec-grab{font-size:20px;color:#7dae94}
.traffic-record.dragging,.packet.dragging{opacity:.38}
.approval{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#2c261a;border:1px solid #6c5535;padding:11px 12px;margin-top:12px;font-size:11px}
.approval span{color:#e3cca1;letter-spacing:.1em}.approval strong{font:800 22px ui-monospace,monospace;color:#ffe3a4;margin-left:auto}.approval small{color:#d5b787}
.drop-target{border:1px dashed #56866e;background:#0c2117;min-height:73px;margin:10px 0;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;text-align:center;padding:10px;color:#85bfa0}
.drop-target.has-item{border-style:solid;background:#1a3c2a;color:#b2f1c9}.drop-target span{font:12px ui-monospace,monospace}
.packet-queue{padding:12px;border-bottom:1px solid #2a4c3d}.packet-list,.lane-packets{display:flex;flex-wrap:wrap;gap:7px;padding:9px 0;min-height:55px}
.packet{display:flex;align-items:center;gap:7px;border:1px solid #487667;background:#15352a;min-height:43px;padding:6px 9px;color:#dffbeb;font-family:ui-monospace,monospace;cursor:grab;user-select:none}
.packet:hover,.packet.active{border-color:#a7ffc7;background:#285a42}
.packet .packet-id{color:#b1d0bb;font-size:9px}.packet strong{font-size:16px;color:#a3ffcb}.packet small{font-size:9px;color:#dfbf83}
.empty-drop{font-size:10px;letter-spacing:.09em;color:#6b9b86;align-self:center;pointer-events:none}
.route-lanes{padding:10px;display:grid;gap:7px}.route-lane{min-height:100px;border:1px solid #365849;background:#0c2119;padding:10px}.route-lane:hover{border-color:#79be8e}.route-lane.overload{border-color:#b4504b;background:#281a1b}
.lane-head{display:flex;justify-content:space-between;gap:7px;align-items:center}.lane-head strong{font:800 12px ui-monospace,monospace;color:#c6f4d6}.lane-head small{display:block;font-size:10px;color:#96aa9e}.lane-head>b{font:800 15px ui-monospace,monospace;color:#a9e6be;white-space:nowrap}
.small-note{font-size:11px;color:#98b9aa;margin:10px 0}
.log-evidence{margin:0;border:none;max-height:245px;overflow-y:auto;font-size:11px}
.analyst-output{margin-top:10px;min-height:105px;max-height:165px}
.crypto-stack{display:grid;gap:15px;padding:18px;background:#071712}.cipher-string{font:800 clamp(16px,2vw,23px) ui-monospace,monospace;letter-spacing:.07em;color:#dcad8b;overflow-wrap:anywhere;margin-top:5px}
.cipher-string.decoded{color:#9fe7bd}
.dial-wrap{margin:17px 0;background:#12231b;border:1px solid #2a4f3c;padding:14px}.dial-wrap label{display:block;margin-bottom:12px;font-family:ui-monospace,monospace;color:#bee7ca}
.dial-ruler{display:flex;justify-content:space-between;font:10px ui-monospace,monospace;color:#729d88}
@media(max-width:540px){.traffic-record{grid-template-columns:20px 1fr 1fr;gap:5px}.traffic-record .rec-dest,.traffic-record .rec-grab{display:none}.taskstrip{display:block}.telemetry-row>div{padding:6px}.telemetry-row strong{font-size:14px}.packet-list,.lane-packets{gap:5px}.packet{padding:5px;gap:4px}.packet strong{font-size:14px}.screen-cap{letter-spacing:0}}
</style>

function makeRouteSector(phase){
  const safe=[];let previous=rand(3);
  for(let col=0;col<3;col++){
    let ix=col===0?previous:pick([previous-1,previous,previous+1].filter(n=>n>=0&&n<=2));
    safe.push(HOPS[col][ix]);previous=ix;
  }
  const nodes={};
  HOPS.flat().forEach(id=>{
    nodes[id]={risk:range(18,37),stability:range(44,94)};
    if(safe.includes(id))nodes[id]={risk:range(7,14),stability:range(79,98)};
  });
  return {nodes,safe,route:[],probed:[],attempts:0,phase};
}
function makeFirewallCase(index){
  const source=pick(SOURCES),protocol=pick(TRANSPORTS),port=pick(PORTS);
  const validToken=`S${range(100,999)}`;
  let fakeToken=`S${range(100,999)}`; if(fakeToken===validToken)fakeToken=`S${Number(fakeToken.slice(1))===999?998:Number(fakeToken.slice(1))+1}`;
  const main={source,protocol,port,token:validToken,signature:'VERIFIED',destination:'ARCHIVE'};
  const decoys=[
    {source:pick(SOURCES.filter(x=>x!==source)),protocol:pick(TRANSPORTS),port:pick(PORTS),token:fakeToken,signature:'VERIFIED',destination:'ARCHIVE'},
    {source:pick(SOURCES),protocol:pick(TRANSPORTS),port:pick(PORTS),token:`S${range(100,999)}`,signature:'REJECTED',destination:'ARCHIVE'},
    {source:pick(SOURCES),protocol:pick(TRANSPORTS),port:pick(PORTS),token:`S${range(100,999)}`,signature:'VERIFIED',destination:'BACKUP'},
    {source:pick(SOURCES),protocol:pick(TRANSPORTS),port:pick(PORTS),token:`S${range(100,999)}`,signature:'REJECTED',destination:'BACKUP'}
  ];
  return {index,main,token:validToken,flows:shuffle([main,...decoys])};
}

function generateDigits(){
  const last=range(1,5),increase=range(1,3),first=last+increase,delta=range(1,Math.min(3,first));
  return {digits:[first,range(1,8),first-delta,last],increase,delta};
}
function makeLogCase(index){
  const culprit=pick(SOURCES),others=shuffle(SOURCES.filter(s=>s!==culprit));
  const token=`T${range(100,999)}`;let otherToken=`T${range(100,999)}`;if(otherToken===token)otherToken='T'+(Number(token.slice(1))===999?998:Number(token.slice(1))+1);
  const expiredToken=`T${range(100,999)}`;
  const lines=[
    `${timeMark(index,0)} ${others[0].padEnd(10)} LOGIN REJECTED · invalid signature`,
    `${timeMark(index,1)} ${culprit.padEnd(10)} VALID AUTH TOKEN issued: ${token}`,
    `${timeMark(index,2)} ${others[1].padEnd(10)} VALID AUTH TOKEN issued: ${otherToken}`,
    `${timeMark(index,3)} ${others[2].padEnd(10)} LOGIN REJECTED · expired token ${expiredToken}`,
    `${timeMark(index,4)} ARCHIVE-01  Export requested with token ${otherToken}`,
    `${timeMark(index,5)} ARCHIVE-01  Export DENIED · token ${otherToken}`,
    `${timeMark(index,6)} ARCHIVE-01  Export requested with token ${token}`,
    `${timeMark(index,7)} ARCHIVE-01  Export AUTHORISED · token ${token}`,
    `${timeMark(index,8)} MONITOR-03  Session close · policy normal`
  ];
  return {index,culprit,lines,token};
}

function timeMark(caseNo,i){return `0${9+Math.floor((caseNo*7+i)/60)}:${String((caseNo*7+i)%60).padStart(2,'0')}`}

function makeTrafficWave(index){
  const sizes=shuffle([10,10,15,15,20,30]);
  const packets=sizes.map((size,id)=>({id,size,kind:'STANDARD',lane:null}));
  const order=shuffle([...packets]);
  const solution={A:[order[0],order[1]],B:[order[2],order[3]],C:[order[4],order[5]]};
  solution.A[0].kind='SECURE'; // Secure traffic may use A or C.
  solution.C[0].kind='CONTROL'; // Control traffic requires C.
  const totals=['A','B','C'].map(l=>solution[l].reduce((a,p)=>a+p.size,0));
  const caps=totals.map(v=>v+range(12,20));
  return {index,packets,caps,minAlpha:Math.max(10,totals[0]-5),minCharlie:Math.max(10,totals[2]-5)};
}

  if(game==='terminal'){
    const key=generateDigits();state.mini={connected:false,authenticated:false,configured:false,bootRead:false,rotated:false,codeDigits:key.digits,increase:key.increase,delta:key.delta,mode:pick(['quiet','balanced','resilient']),integrity: Array.from({length:3},()=>range(2,9)),verified:false,history:['SYSTEM READY. Type help to view supported commands.'],solved:false};

  if(game==='cipher'){

}

function executeRouteScan(raw){const m=state.mini,s=m.sector,v=raw.trim().toUpperCase().replace(/\s+/g,' ');const match=/^SCAN\s+([A-I])$/.exec(v);
 if(!match){setFeedback('Command format: scan A   (replace A with any relay A–I).','error');render();return}
 const id=match[1];if(!s.probed.includes(id))s.probed.push(id);
 setFeedback(`${id} diagnostic completed: TRACE ${s.nodes[id].risk}, STABILITY ${s.nodes[id].stability}%.`,'good');render();$('#route-scan')?.focus();}

function routePick(id){const s=state.mini.sector;const r=s.route;
  if(id==='YOU'){s.route=[];setFeedback('Route cleared. Start with column A–C.');render();return}
  if(!r.length){if(HOPS[0].includes(id)){r.push(id);state.feedback=null}else setFeedback('Start with a relay in the first column (A, B or C).','error')}
  else if(r.length<3){const next=HOPS[r.length];if(next.includes(id)&&EDGES.some(([a,b])=>a===r.at(-1)&&b===id)){r.push(id);state.feedback=null}else if(HOPS[0].includes(id)){s.route=[id];state.feedback=null}else setFeedback('That relay is not connected to your current route. Follow the visible links.','error')}
  else if(r.length===3){if(id==='SERVER'){r.push('SERVER');state.feedback=null}else if(HOPS[2].includes(id)&&EDGES.some(([a,b])=>a===r[1]&&b===id)){s.route=[r[0],r[1],id];state.feedback=null}else if(HOPS[0].includes(id)){s.route=[id];state.feedback=null}else setFeedback('Select the destination, or choose another relay in column three.','error')}
  else {s.route=HOPS[0].includes(id)?[id]:[];state.feedback=null}
  render();
}
function testRoute(){const m=state.mini,s=m.sector;if(s.route.length!==4||s.route.at(-1)!=='SERVER')return; if(!s.route.slice(0,3).every(id=>s.probed.includes(id))){setFeedback('Diagnostic incomplete. Probe all three selected relays before verifying the route.','error');render();return;}
  const nodes=s.route.slice(0,3).map(id=>s.nodes[id]),risk=nodes.reduce((a,n)=>a+n.risk,0)+m.riskBonus,stable=Math.min(...nodes.map(n=>n.stability));
  if(risk<=70&&stable>=65){if(m.phase<2){m.phase++;m.sector=makeRouteSector(1);setFeedback(`Gateway access confirmed (trace ${risk}, stability ${stable}%). Next security zone loaded. Analyse and verify a new route.`,'good');addFeed('GATEWAY CONNECTED — ARCHIVE SECTOR UNLOCKED');render()}else{setFeedback(`Archive connection established: trace ${risk}, stability ${stable}%.`,'good');complete()}}
  else {s.attempts++;setFeedback(`Route rejected: trace ${risk}/70, stability ${stable}%/65%. ${risk>70?'Use lower-trace relays.':'Avoid unstable relays.'} Your scans are retained.`,'error');s.route=[];render()}
}

 const id=e.target.id;if(!['term-form','route-scan-form','fw-form','log-form','cipher-form'].includes(id))return;e.preventDefault();if(!state.active||state.mini.solved)return;
 if(id==='term-form')executeCommand($('#term-input').value);
 if(id==='route-scan-form')executeRouteScan($('#route-scan').value);
 if(id==='fw-form')testFirewall();
 if(id==='log-form')executeLogCommand($('#log-command').value);
 if(id==='cipher-form')testCipher();
});
$('#app').addEventListener('change',e=>{const el=e.target;
 if(el.id==='mission-select'&&!state.active){state.mission=el.value;render()}
 else if(el.id==='duration-select'&&!state.active){state.duration=Number(el.value);state.remaining=state.duration;updateClock()}
 else if(el.dataset.intel&&state.active){el.checked?state.intel.add(el.dataset.intel):state.intel.delete(el.dataset.intel);render()}
 else if(el.dataset.fw)state.mini[el.dataset.fw]=el.type==='checkbox'?el.checked:el.value;
});
$('#app').addEventListener('input',e=>{const el=e.target;if(el.id==='cipher-dial'&&state.active&&getGame()==='cipher'){state.mini.parts[state.mini.part].dial=Number(el.value);updateCipherPreview()}});
$('#app').addEventListener('keydown',e=>{const el=e.target.closest('[data-action="route-node"],[data-action="fw-pick"],[data-action="packet-select"]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onClick({target:el})}});
// Native desktop drag/drop for packet cards and packet-monitor records.
$('#app').addEventListener('dragstart',e=>{
 if(!state.active||state.mini.solved)return;
 const packet=e.target.closest('[data-packet]'),record=e.target.closest('[data-flow-index]');
 if(packet&&getGame()==='traffic'){e.dataTransfer.setData('text/plain','packet:'+packet.dataset.packet);e.dataTransfer.effectAllowed='move';packet.classList.add('dragging')}
 else if(record&&getGame()==='firewall'){e.dataTransfer.setData('text/plain','flow:'+record.dataset.flowIndex);e.dataTransfer.effectAllowed='copy';record.classList.add('dragging')}
});
$('#app').addEventListener('dragover',e=>{if(e.target.closest('[data-lane],[data-drop-zone]')){e.preventDefault();e.dataTransfer.dropEffect=e.target.closest('[data-drop-zone]')?'copy':'move'}});
$('#app').addEventListener('drop',e=>{
 const lane=e.target.closest('[data-lane]'),zone=e.target.closest('[data-drop-zone]');if(!lane&&!zone)return;e.preventDefault();if(!state.active||state.mini.solved)return;
 const data=e.dataTransfer.getData('text/plain');if(lane&&data.startsWith('packet:')&&getGame()==='traffic')placePacket(Number(data.split(':')[1]),lane.dataset.lane);
 if(zone&&data.startsWith('flow:')&&getGame()==='firewall')firewallPick(Number(data.split(':')[1]));
});
$('#app').addEventListener('dragend',()=>document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')));
// Draw wires by dragging from the current connection endpoint to the next relay.
let routeDrag=null;
function svgCoords(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const mat=svg.getScreenCTM();return mat?p.matrixTransform(mat.inverse()):{x:0,y:0}}
$('#app').addEventListener('pointerdown',e=>{const node=e.target.closest('#route-svg [data-id]');if(!node||!state.active||getGame()!=='routing'||state.mini.solved)return;
 const start=node.dataset.id,route=state.mini.sector.route,last=route.at(-1)||'YOU';if(start!==last)return;
 routeDrag={start,x:e.clientX,y:e.clientY,svg:node.ownerSVGElement};
 const line=$('#drag-wire'),pos=POS[start];if(line){line.style.display='';line.setAttribute('x1',pos[0]);line.setAttribute('y1',pos[1]);line.setAttribute('x2',pos[0]);line.setAttribute('y2',pos[1])}
});
document.addEventListener('pointermove',e=>{if(!routeDrag)return;const p=svgCoords(routeDrag.svg,e),line=$('#drag-wire');if(line){line.setAttribute('x2',p.x);line.setAttribute('y2',p.y)}});
document.addEventListener('pointerup',e=>{if(!routeDrag)return;const was=routeDrag;routeDrag=null;const line=$('#drag-wire');if(line)line.style.display='none';if(Math.hypot(e.clientX-was.x,e.clientY-was.y)<12)return;
 const xy=svgCoords(was.svg,e);let target=null,min=40;
 Object.entries(POS).forEach(([id,p])=>{const d=Math.hypot(p[0]-xy.x,p[1]-xy.y);if(d<min){min=d;target=id}});
 if(target&&target!==was.start&&state.active&&getGame()==='routing'){routePick(target);suppressRouteClick=Date.now()+250}
});
let suppressRouteClick=0;
setInterval(()=>{if(!state.active||state.duration===0)return;state.remaining=Math.max(0,state.remaining-1);updateClock();if(state.remaining===0)endMission(false)},1000);
const selector=$('#mission-select');selector.innerHTML=Object.entries(MISSIONS).map(([id,m])=>`<option value="${id}">${esc(m.name)}</option>`).join('');render();
</script>
</body>
</html>
